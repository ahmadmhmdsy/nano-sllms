# E-61 V2-1 KD arm: attempt-3 recipe (recorded control) + ONE variable: teacher-KD term.
# Teacher soft labels: runs/diac/stage2b2500/kd_labels (merged memmap, sel manifest).
# KD is admitted ONLY at positions where teacher argmax == gold hard label (v21 gate).
name: dia2j_v21_kd_v2
model:
  frozen_layers: 0
  layers: 4
  hidden: 320
  heads: 8
  kv_heads: 2
  ctx: 96
  ffn: 1280
  tie_embeddings: false
data:
  tokens_dir: data/diac/v3q/tokens
train:
  output_dir: runs/mex/dia2j_v21_final
  seed: 42
  batch: 256
  accum: 2
  eval_batch: 256
  max_steps: 3000
  grad_scaler: true
  eval_steps: 500
  save_steps: 1000
  logging_steps: 50
  lr: 0.0001
  head_lr: 0.0006
  warmup_steps: 300
  weight_decay: 0.1
  mark_loss_weight: 1.0
  logit_adjust_tau: 1.0
  init_from: runs/mex/dia2j_e60a/final
  kd:
    labels_dir: runs/diac/stage2b2500/kd_labels
    weight: 0.5
    admit: teacher_argmax_eq_gold
