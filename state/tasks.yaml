  - id: task-kd-redesign-v1
    status: in_progress
    note: >-
      Pipeline bug found + fixed (2026-09-28): the training-loop monitor
      condition required evaluation_cadence steps that are NOT checkpoint steps
      ('!= 0'), so when both cadences are 100 the monitor never fires and the
      stage marker binding fails. Fixed to fire at every evaluation_cadence
      step. First kd_redesign attempt trained fine (val 2.99@600) but FAILed on
      the missing monitor_report.jsonl; re-running with the fix (pwsh-88).
      Second issue: the training loop reached the monitor code 3-4x per
      optimizer step (gradient accumulation), so the early-stop patience was
      consumed too fast and the run early-stopped at step 300. Fixed by
      deduplicating monitor records (one per step). Re-running (pwsh-94).
    plan: >-
      Redesigned KD arm (E-008 follow-up): beta 0.15, T 2.0, active_fraction 0.5,
      teacher u2h weight-average, student 12L/192h, corpus data/u4/prepared,
      600 steps. First attempt (batch 8x2) OOMed at optimizer step ~417 with a
      healthy curve (val 10.4->2.73); retuned to batch 4x4 (effective 16, same
      as kd_control_u5) and relaunched (pwsh-81).

