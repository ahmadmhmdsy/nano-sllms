      Training on the full character set beats the best inference-side band-aid on the
      registered gate by 20.29 pct relative.
      WHAT WAS ASKED. E-094/E-095/E-096 repaired the train/inference input-alphabet
      mismatch at INFERENCE time by deleting untrained characters from the input. E-097
      asked whether TRAINING on the full character set is better than that band-aid.
      THE RESULT, 30000 steps per arm, byte-identical warm start, identical seed, the ONLY
      difference the token bed, scored with the registered scorer after the run:
        arm A (v3ctx256, stripped)  single 0.247021 | nospace 0.183264 | base_only 0.183386
        arm B (v3full, full set)    single 0.146185 | nospace 0.569627 | base_only 0.625349
      (gate_mean3 over fadel_test, sadeed25, wikinews2014.) The abdou_test dev selector
      chose base_only for arm A and single for arm B, so best(A) = 0.183386 and
      best(B) = 0.146185, ratio 0.797146 -> -20.29 pct, clearing the pre-registered bar
      0.98 * best(A) = 0.179718. The secondary anchor against the deployed E-095
      recommendation (0.159495) is also cleared: 0.146185 <= 0.156305. Arm B wins on all
      four corpora, including unregistered wikinews2024.
      THE OTHER RESULT, operationally important: E-095's nospace fix is a COMPENSATION for
      the mismatch, not an improvement in its own right. It is arm A's near-best mode and
      arm B's worst by a wide margin (arm B nospace 0.569627 against single 0.146185; on
      abdou_test +334.30 pct). A deployed full-character-set model must be decoded with
      single/raw text. This does not disturb E-095, measured on a stripped-alphabet model.
      WHAT THIS DOES NOT DO: it does not change the deployed anchor. runs/diac/e73_soup/
      c4b_uniform is a 12-probe soup of e70_c4b_ctx256 at 60000 steps; arm B is a
      30000-step single warm-started model. E-097 establishes that the BED is better.
      Promoting a new gold needs the DEPLOYED recipe re-run on bed B (60000 steps, 12
      probes, soup) as its own registered experiment - the natural follow-up.
      KNOWN LIMITS, recorded: bed B holds 14.8 pct fewer base letters per row on train and
      15.7 pct on val, so the win is not attributable to the alphabet ALONE - but the
      volume deficit works in B's DISFAVOUR and cannot explain a 20.29 pct win. The
      warm-started body had also already adapted to the stripped alphabet, which likewise
      handicaps B. Both arms ran 30000 of the deployed recipe's 60000 steps.
      A PREDICTION WAS WRONG AND IS RECORDED: at step 2000 the gap was -14.32 pct and this
      task predicted it would SHRINK; it widened to -20.29 pct. Arm A was already near its
      asymptote (base_only 0.180099 -> 0.183386, slightly worse) while arm B improved
