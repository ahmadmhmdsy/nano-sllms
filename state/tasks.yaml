      commands (launch gate step 2, docs/agent/OPERATIONS.md):
      & .\.venv\Scripts\python.exe ui/scripts/gate_semantic_follow.py
      runs/v2/ui/u5_full_long2 u5_long2_step3600_family
      data/u4/novel/gate_e004_family.jsonl --step=3600
      --out-dir=runs/v2/ui/u5_full_long2/gates
      and the same with u5_long2_step3600_novel / gate_e004_novel.jsonl.
    evidence:
      - runs/v2/ui/u5_full_long2/train/checkpoints/scores.json
      - runs/v2/ui/u5_full_long2/validate/config/resolved.yaml
      - runs/v2/ui/u5_full_long2/gates/semantic_u5_long2_step3600_family.json
      - runs/v2/ui/u5_full_long2/gates/semantic_u5_long2_step3600_novel.json
    supersedes: []
    aliases:
      - E-012-gate
    notes: >-
      u5_full_long2 stopped at optimizer step 3850 with no train-stage
      COMPLETE.json (and no checkpoints_avg/), so the automatic best/last
      policy path in gate_semantic_follow.py cannot run. An explicit
      --step=N option (added 2026-10-02) names one published complete
      checkpoint directly; every step-* directory carries its own
      COMPLETE.json. The best published checkpoint per scores.json is
      step-3600 (val_loss 0.5802), the checkpoint this task gates.
      The pre-registered E-012 gate targets the +avg checkpoint, which does
      not exist for a stopped run; the user's explicit "evaluate the best
      checkpoint" instruction takes precedence, so step-3600 is gated.
      gate_semantic_follow.py was untracked and could not run as found:
      three defects fixed 2026-10-02 before any gate number was trusted -
      (1) _valid_rec was defined after the loop that calls it (NameError),
      (2) infer_arch had a nested max() over an int (TypeError), (3) the
      prompt appended a literal backslash-n instead of a newline, off the
      documented task+newline convention. The decode loop was also rewritten
      to batched generation in chunks of 8 plus a validation thread pool,
      per the rules/gpu.md performance policy (user-adopted 2026-09-28); the
      per-task loop it replaced was the forbidden slow path (measured
      24.9 s/task vs 4.2 s/task batched).
      RESULT (2026-10-02, checkpoint step-00003600, 120 tasks per column):
      family greedy_valid 47/120 = 0.392, pass@4 100/120 = 0.833,
      semantic@1 0.333, archetype-inference@1 0.800, section@1 0.841;
      novel greedy_valid 63/120 = 0.525, pass@4 118/120 = 0.983,
      semantic@1 0.367, archetype-inference@1 0.667, section@1 0.791.
      Gate execution label: PASS (pre-registered protocol followed, both
      columns at 120 tasks, all registered metrics present, artifacts parsed).
      Baseline for the same two columns is runs/v2/ui/u2_arms/gates/
      u5_full+avg_{family,novel}.json (u5_full_depth12 +avg): greedy 0.725 /
      0.733, pass@4 0.917 / 0.900. step-3600 is therefore BELOW baseline on
      greedy validity on both columns and on pass@4 for family, and ABOVE
      baseline on pass@4 for novel. A 24-task controlled re-run with the old
      literal-backslash-n prompt reproduced the new-prompt numbers exactly
      (greedy 0.042, pass@4 0.625), so the prompt fix is not the cause; the
      gap is a property of this checkpoint, not of the harness. Limitation:
      unlike the baseline artifacts, these records do not store the emitted
      chain text, so individual invalid chains cannot be re-audited from the
      artifact alone.
  - id: ui/task-landing-page-capability
    title: Capability probe - can the U-line models build a "shop landing page"?
    scope: ui
    status: completed
    owner: UNKNOWN
    created_at: "2026-10-02"
    updated_at: "2026-10-02"
    last_verified_at: "2026-10-02"
    next_action: >-
      No agent action pending; the probe answered the user's question. The open
      decision is whether to extend the corpus with a storefront/landing
      archetype as a new pre-registered experiment, or to accept the
      8-archetype admin-widget scope as the line's deliverable
      (NEEDS_USER_DECISION).
    evidence:
      - runs/v2/ui/capability_probe/landing_page_outputs.json
      - runs/v2/ui/capability_probe/corpus_layout_diversity.json
      - data/v2/prepared/ui_chain_eos_u5full/g-27d4e546e2edbdea/prepared.jsonl
    supersedes: []
    aliases:
      - landing-page-probe
    notes: >-
      QUESTION (2026-10-02): with every UI model including the best one, can a
      prompt like "shop landing page for cloths" produce a shop landing page?
      METHOD: 8 checkpoints (u5_full+avg, u4_eos_avg+avg, u3_eos_avg+avg,
      eos_progavg, eos_avg5, combo_avg, u5_long2 step-3600, u1_full/final),
      greedy decode, max_new_tokens 600, two prompts (the user's exact wording
      and the corrected "clothes"), each chain validated with
      ui/src/validate.py validate_chain.
      RESULT: 0 of 16 generations produced anything resembling a landing page.
      8/16 chains were valid, and every valid chain was one of the 8 trained
      archetypes. Archetypes emitted: search_results 5, profile_card 3,
      notifications_center 2, orders_table 2, settings_form 2, todo_list 1,
      unparseable 1. The models also rewrite the task for themselves in the
      TASK line: u1_full answered "shop landing page for cloths" with
      "TASK a profile card for a widget for the app".
      ROOT CAUSE (measured on the exact training corpus, 73,600 documents):
      the corpus holds only 13 distinct layout skeletons built from only 17 of
      the 41 catalog components. The 13 are the 8 archetypes plus 5 variants
      (dashboard with LineGraph vs BarGraph, profile with/without Progress,
      settings with one vs two switches, pricing with/without Badges,
      dashboard with two vs three metrics). The 24 catalog components that
      never appear include every one a storefront needs: Image, Carousel,
      Link, Rating, Separator, Icon, Avatar, Tabs, Textarea, Checkbox, Radio,
      Slider, Dialog, Drawer. The model has never emitted an Image element.
      The earlier U-1 corpus behind u1_full (data/u1/full/raw, 42,000
      documents) carries the identical constraint: the same 13 skeletons and
      the same 17 component types, so this is a property of the U-line corpus
      lineage rather than of any one generation or checkpoint.
      Commerce vocabulary does exist in the task text (shop 2030, product 2734,
      buy 2520, catalog 1382, landing 5, clothes 4) but every such task is
      paired with an admin-widget body: "shop packing list widget" becomes
      todo_list, "bookshop preferences: pick my role" becomes settings_form,
      "alerts panel for the shop" becomes notifications_center. The mapping
      the models learned is commerce words to standard admin widget, never
      commerce words to storefront.
      CLOSEST OUTPUT: the search_results archetype, whose generator items are
      products with prices (Desk lamp, Monitor stand, USB hub). eos_avg5
      produced a valid one titled "Search products" with STAX results
      [{"name":"Desk lamp","price":96},...] and a repeated item Card - a
      product list, but rendered as a search panel: no hero, no nav, no image
      grid, no cart.
      LIMITATION: the probe artifact records chain text for every generation,
      but this is a capability assessment, not a pre-registered gate, so it
      carries no validity metric against a registered task column. Coverage is
      8 run directories that still exist; u5a_depth12_small and
      u5b_depth14_small have gate artifacts but no run directory on disk, so
      they could not be re-probed.

