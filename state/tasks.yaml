      was the only mechanism with a measured significant effect was VOIDED twice in
      this same arc: E-092 showed the vote entire gain is chunk-boundary repair
      (91.8 pct of the reduction comes from words within 8 chars of the
      non-overlapping 256-char chunk boundary that bench.predict_bares creates) and
      E-093 showed the majority step itself is a NO-OP (vote 0.188956 vs centered
      0.189054, 24 discordant words in 41,019, p=0.541). The deployed decode is
      therefore a CENTERED-WINDOW DECODE, not a combination. SEPARATELY, E-094/E-095
      (a decode-contract repair, NOT a combination) then moved the registered gate
      far more than any combination arm ever did: the model was fed untrained input
      characters at inference, and skipping them gives gate_mean3 0.208612 ->
      0.159495 = -23.54 pct, ACCEPTED on the pre-registered registered gate (E-095).
      Do NOT cite 0.208612 as the deployed baseline; the corrected baseline is
      0.159495. E-096 (base_only, the principled arm) closed INCONCLUSIVE at
      -1.87 pct vs nospace, under the pre-registered 2 pct bar. WHAT IS LEFT HERE:
      nothing on the combination axis - it is exhausted. The only remaining routes
      are a DIFFERENT model (word-level / variable-length, or a from-scratch causal
      AR decoder, both real training runs needing a user-opened window) and the
