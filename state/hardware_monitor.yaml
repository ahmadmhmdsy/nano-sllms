# state/hardware_monitor.yaml - live hardware picture (generated by the
# user-adopted performance policy; agent MUST read this before any launch and
# update after every layout decision, evidence-first).
policy:
  created: "2026-09-28"
  authority: user instruction (explicit, 2026-09-28) - always run at the
    maximum hardware speed; batched generation (chunks of 8) + parallel CPU
    validation are the FORCED defaults for every gate/probe process.
  co_run_rule: >-
    A second process may share the GPU only when measured utilization is
    BELOW 65% at launch time and the sibling is read-only or tiny (< prep
    work / verifier scoring); a protected training job keeps its one-job
    priority and is never co-run against.
  measurement: >
    util via nvidia-smi --query-gpu=utilization.gpu ; memory via
    --query-gpu=memory.used ; per-process list via --query-compute-apps.
